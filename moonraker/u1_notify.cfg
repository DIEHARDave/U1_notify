# U1_notify - Moonraker settings
# Based on ghzserg's notify plugin for Zmod (https://github.com/ghzserg/notify).
# install.sh links this file into extended/moonraker/; updates replace it,
# so don't edit it. To change or turn off a notifier, add a section with the
# same name to u1_notify_custom.cfg (see that file).
#
# {secrets.notify.url} and {secrets.notify.name} come from
# ~/printer_data/moonraker.secrets, which UPDATE_NOTIFY fills in from
# u1_notify.txt.
#
# The photo comes from the internal camera (camera: internal: paxx12 in
# extended2.cfg).

[u1_notify]

[notifier print_start]
url: {secrets.notify.url}
events: started
body: {secrets.notify.name}: The printer has started printing the file '{event_args[1].filename}'
attach: http://127.0.0.1/webcam/snapshot.jpg

[notifier print_complete]
url: {secrets.notify.url}
events: complete
body: {secrets.notify.name}: The printer has finished printing the file '{event_args[1].filename}'
attach: http://127.0.0.1/webcam/snapshot.jpg

[notifier print_error]
url: {secrets.notify.url}
events: error
body: {secrets.notify.name}: Error {event_args[1].message} {event_args[1].filename}
attach: http://127.0.0.1/webcam/snapshot.jpg

[notifier print_cancelled]
url: {secrets.notify.url}
events: cancelled
body: {secrets.notify.name}: Printing canceled {event_args[1].message} {event_args[1].filename}
attach: http://127.0.0.1/webcam/snapshot.jpg

[notifier print_paused]
url: {secrets.notify.url}
events: paused
body: {secrets.notify.name}: Pause {event_args[1].message} {event_args[1].filename}
attach: http://127.0.0.1/webcam/snapshot.jpg

[notifier print_resumed]
url: {secrets.notify.url}
events: resumed
body: {secrets.notify.name}: Resume printing {event_args[1].message} {event_args[1].filename}
attach: http://127.0.0.1/webcam/snapshot.jpg

# Used by the _NOTIFY macro (PHOTO=0 and PHOTO=1). "gcode" matches no
# Moonraker event, so these only send what _NOTIFY asks for.
[notifier notifier]
url: {secrets.notify.url}
events: gcode
body: {secrets.notify.name}: {event_message}

[notifier notifier_photo]
url: {secrets.notify.url}
events: gcode
body: {secrets.notify.name}: {event_message}
attach: http://127.0.0.1/webcam/snapshot.jpg
